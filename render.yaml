services:
  - type: web
    name: auction-backend
    env: python
    rootDir: auction_backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    disk:
      name: auction-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: auction-backend.onrender.com
      - key: DATABASE_URL
        value: sqlite:////var/data/db.sqlite3
      - key: DJANGO_MEDIA_ROOT
        value: /var/data/media
      - key: SERVE_MEDIA_FILES
        value: "True"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
      - key: CORS_ALLOWED_ORIGINS
        value: https://auction-frontend.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://auction-frontend.onrender.com
      - key: AUCTION_RESET_PIN
        value: "2254"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "31536000"
      - key: DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "True"
      - key: DJANGO_SECURE_HSTS_PRELOAD
        value: "True"

  - type: web
    name: auction-frontend
    env: static
    rootDir: auction-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://auction-backend.onrender.com
